ci:
  skip: [mypy, regen-readme, ty]

default_language_version:
  python: python3.15

repos:
  # general checks (see here: https://pre-commit.com/hooks.html)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # actionlint - GitHub Actions workflow linting
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # ruff - linting + formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        name: ruff
      - id: ruff-format
        name: ruff-format

  # ty - lint-like type checking (Astral, preview)
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.99
    hooks:
      - id: ty
        name: ty

  - repo: local
    hooks:
      # mypy - lint-like type checking, in the project env (same versions as uv.lock)
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      # runs the test suite and checks README.md against templates/README.md.j2
      - id: regen-readme
        name: pytest & readme drift
        entry: uv run scripts/regen_readme.py --check
        language: system
        files: ^(README\.md|templates/README\.md\.j2|scripts/.*|pyproject\.toml|uv\.lock|\.python-version|Dockerfile|src/.*|tests/.*)$
        pass_filenames: false

  # oxfmt - formatting YAML, JSON, Markdown, ...
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.77.0
    hooks:
      - id: oxfmt
        types_or: [yaml, markdown, json]
        # README.md is generated from templates/README.md.j2
        exclude: ^(uv\.lock|README\.md)$
