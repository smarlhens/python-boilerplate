name: zizmor

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/**"

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: |
            .github/workflows/
          # fork PRs get a read-only token, so SARIF upload would fail: print findings instead
          advanced-security: ${{ github.event.pull_request.head.repo.fork != true }}
